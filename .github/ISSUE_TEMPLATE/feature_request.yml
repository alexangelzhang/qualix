name: Feature request
description: Suggest an improvement to Qualix
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What quality-gate workflow or developer experience problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Requirements / Q01
        - Technical design / Q02-Q04
        - Unit tests / Q05-Q06
        - Code review / Q07
        - CLI / installation
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this affect most?
      description: Leave blank if not phase-specific.
      options:
        - Q01 — Requirements structuring
        - Q02 — Technical design generation
        - Q03 — Technical design quality review
        - Q04 — Technical design coverage audit
        - Q05a — EUT matrix design
        - Q05b — Unit test code generation
        - Q06 — Unit test coverage audit
        - Q07 — Code review
        - Not phase-specific
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
