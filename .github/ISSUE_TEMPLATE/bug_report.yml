name: Bug report
description: Report a reproducible Qualix bug
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove private project data, tokens, internal links, and customer information before submitting.
  - type: input
    id: version
    attributes:
      label: Qualix version or commit
      placeholder: "0.2.0.dev20260511 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 14, Python 3.11.9"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: What did you run?
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or stack traces.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a sanitized repo or paste a synthetic example.
    validations:
      required: false
