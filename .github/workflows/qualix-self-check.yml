name: Qualix Self Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and Publish Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qualix
        run: python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q src/qualix tests scripts

      - name: Run publish-readiness scan
        run: python scripts/check_publish_readiness.py

      - name: Run tests
        run: python -m pytest tests/ -q

  quality-gate-example:
    name: Composite Action Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate action metadata
        run: test -f action.yml
