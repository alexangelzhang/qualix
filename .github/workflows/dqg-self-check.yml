name: DQG Self Quality Check

on:
  pull_request:
    paths:
      - 'qualix/src/**'
      - 'qualix/skills/**'
  push:
    branches: [main]
    paths:
      - 'qualix/src/**'

jobs:
  regression:
    name: DQG Regression Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DQG
        run: pip install -e qualix/qualix --quiet

      - name: Run regression tests
        run: |
          cd qualix/qualix
          python -m pytest tests/ -x -q --tb=short

  # CI Gate example (requires finalize artifacts to exist)
  # Uncomment when integrating into a project that runs DQG phases:
