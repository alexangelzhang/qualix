display_name: 研发质量门禁
short_description: 从需求到代码的全链路防漏流水线（需求结构化 → 技术方案审计 → 单测生成 → 覆盖审计 → 代码评审）
default_prompt: |
  执行研发质量门禁流程。
  根据当前上下文自动识别应进入的阶段：
  - Phase A: 需求结构化（PRD → 需求点/关键语义/缺口/待确认项）
  - Phase A.5: 技术方案覆盖度审计
  - Phase A.6: 技术方案质量评审
  - Phase B: 单测生成（从需求生成测试大纲和单测代码）
  - Phase C: 单测覆盖审计（含变异测试）
  - Phase D: 预落地代码评审
  优先支持飞书URL直读，不依赖人工转MD。
