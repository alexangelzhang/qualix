# SE 推导 Checklist — 通用维度 + java-ddd-tmf 特定维度
# Q01 Step 3b 加载此文件，逐维度扫描 REQ/BR 生成 SE

dimensions:
  # ===== 通用维度（所有技术栈） =====

  - id: state_machine
    name: 状态机完整性
    optional: false
    applies_when: "PRD 包含状态流转、审批流、工单生命周期"
    questions:
      - "每条迁移边是否有触发条件和数据流定义？"
      - "是否存在非法跳转路径？如何拦截？"
      - "终态是否不可回退？"
      - "循环边（驳回→重新发起）的数据流是否定义？"
      - "并行状态（如审批中+发放中）是否互斥？"
    se_examples:
      - scenario: "PRD 定义了 N 个状态，但未列出非法跳转"
        bad_se: "需要拦截非法状态跳转"
        good_se:
          description: "除 PRD 明示的 K 条合法迁移外，其余任意 (src, dst) 调用必须返回 409 CONFLICT 且不修改状态"
          verification: "对每个非法 (src, dst) 组合发一次状态迁移请求；断言 HTTP 409 + errorCode=INVALID_TRANSITION + 查询状态未变"
      - scenario: "同一 src 状态有多条出边（如发放失败→完成 / 发放失败→重新申请）"
        bad_se: "根据业务规则决定流向"
        good_se:
          description: "发放失败后，若 retry_count < 3 流转到待提交；否则流转到完成并打终态标记"
          verification: "参数化测试：retry_count ∈ {0, 2, 3, 5}，断言目标状态分别为 {待提交, 待提交, 完成, 完成}"

  - id: concurrency
    name: 并发/幂等
    optional: false
    applies_when: "always"
    questions:
      - "同一资源被多人同时操作时的行为？（乐观锁/悲观锁/队列）"
      - "重复提交同一请求的结果？（幂等键是什么？）"
      - "批量操作中部分失败时的回滚策略？"
    se_examples:
      - scenario: "多用户同时对同一业务对象（VIN/订单号/工单 ID）执行写操作"
        bad_se: "需要并发控制防止重复提交"
        good_se:
          description: "同一 {业务主键} 并发发起 N 次写操作时仅允许 1 次成功，其余返回 409 CONFLICT + errorCode=DUPLICATE_SUBMIT，数据库仅产生 1 条记录"
          verification: "CountDownLatch 发起 N 个并发请求；断言恰好 1 次 2xx、N-1 次 409；SELECT COUNT(*) WHERE {业务主键}={x} 结果为 1"
      - scenario: "客户端重试同一请求（网络抖动/超时重发）"
        bad_se: "防止重复数据"
        good_se:
          description: "相同 idempotencyKey + 相同 payload 的请求在 {时间窗口} 内必须返回首次结果，不触发二次业务逻辑"
          verification: "先调用成功获取 responseA；立即重放同 payload+idempotencyKey 获取 responseB；断言 responseA==responseB 且下游（订单/支付）仅被调用 1 次"

  - id: permission
    name: 权限边界
    optional: false
    applies_when: "PRD 涉及多角色或数据隔离"
    questions:
      - "每个角色能看到哪些数据？能执行哪些操作？"
      - "跨角色/跨组织的数据隔离在哪一层实现？（查询层/API层/数据库层）"
      - "权限校验是否在 API 入口统一拦截，而非散落在业务代码中？"

  - id: data_consistency
    name: 数据一致性
    optional: false
    applies_when: "PRD 涉及多表更新、多系统交互、异步操作、两个入口、多入口、同步、一致性、冗余字段、数据对齐"
    questions:
      - "跨表/跨服务的数据更新是否在同一事务内？"
      - "异步操作（消息队列/回调）失败时数据是否会不一致？"
      - "缓存与数据库的一致性策略？"
    se_examples:
      - scenario: "同一业务动作有多个入口（如金刚位+投诉单两个入口都能提交善意关怀）"
        bad_se: "两个入口数据保持一致"
        good_se:
          description: "入口 A 和入口 B 对同一业务主键提交后，读取聚合视图时核心字段 {字段列表} 完全一致，且入口标识字段正确标记数据来源"
          verification: "分别通过入口 A/B 提交 payload_A / payload_B（核心字段相同）；查询统一列表接口，断言两条记录核心字段 == 提交值、source_channel ∈ {A, B}"
      - scenario: "写主库 + 发消息/更新缓存 的异步链路"
        bad_se: "保证最终一致"
        good_se:
          description: "主库写入成功后，{N 秒}内下游（缓存/ES/MQ 消费方）必须收到变更；消息消费失败时进入死信队列并告警，不允许静默丢失"
          verification: "写入后 poll 下游读接口直到命中或超时（断言 ≤N 秒）；人为抛出消费异常，断言死信队列有对应消息 + 告警计数 +1"

  - id: precision
    name: 精度/溢出
    optional: false
    applies_when: "PRD 涉及金额、数量、百分比计算"
    questions:
      - "金额计算是否使用高精度类型？（Java: BigDecimal, Go: decimal）"
      - "累加多个金额时的精度保证？（每步 setScale 还是最终 setScale）"
      - "数量/金额是否有上下限校验？溢出时的行为？"

  - id: error_recovery
    name: 异常恢复
    optional: false
    applies_when: "always"
    questions:
      - "中间步骤失败时的回滚/补偿策略？"
      - "失败后能否重试？重试是否幂等？"
      - "异常状态的数据是否会被后续流程误读？"
    se_examples:
      - scenario: "用户操作失败（提交/保存/审批拒绝）后的数据处理规则"
        bad_se: "失败时回滚数据"
        good_se:
          description: "用户提交 {业务动作} 失败时（校验/依赖/超时任一失败），本次输入的 {字段列表} 必须在前端保留至少 {N 分钟} 供重试；后端侧不得留下任何 status=PROCESSING 的中间态记录，否则视为数据孤岛"
          verification: "Mock 依赖抛异常触发失败；断言 GET 该业务主键详情无 PROCESSING 记录；断言前端表单 fields 与提交时完全一致（包括输入顺序、格式）；{N 分钟} 内发起重试断言成功；{N+1 分钟} 后前端表单自动清空"
      - scenario: "可撤销的业务动作（如撤销申请/撤回审批）被调用后的状态回退目标"
        bad_se: "撤销后恢复原状态"
        good_se:
          description: "{业务动作} 被撤销后，业务对象必须回退到撤销发起前的 {明确的前置状态}（不是「未知原状态」），且数据库 audit_log 有 1 条 status=CANCELLED_BY_USER 记录标注撤销人/时间/前置状态；用户再次发起同动作时必须走新流程（新 ID），不得复用撤销记录"
          verification: "构造：状态迁移链 A→B→C 中，在 C 处撤销；断言回到 B（非 A）；SELECT * FROM audit_log WHERE action='CANCEL' AND target_id=? 恰有 1 条，字段 previous_status=B；用户再发起进入状态 B→C，断言新产生的记录 id 与原 id 不同"

  - id: time_window
    name: 时间窗口
    optional: false
    applies_when: "PRD 涉及有效期、超时、定时任务"
    questions:
      - "时效限制的计算起点和终点是否明确？（创建时间/结案时间/当前时间）"
      - "过期后的处理策略？（禁止操作/自动关闭/提示）"
      - "时区问题：服务器时区与用户时区不一致时的处理？"

  - id: external_dependency
    name: 外部依赖
    optional: false
    applies_when: "PRD 涉及调用外部系统/中台/第三方/审批/BPM/支付网关/风控/发券/外部接口"
    questions:
      - "外部系统超时/不可用时的降级策略？"
      - "外部系统返回异常数据时的校验和兜底？"
      - "调用频率限制（rate limit）和重试策略？"
    se_examples:
      - scenario: "核心链路依赖外部系统（BPM/审批中台/支付网关/风控）"
        bad_se: "外部系统异常时降级处理"
        good_se:
          description: "调用 {外部系统} 超时（>{N 秒}）或返回 5xx 时，业务必须走 {明确的降级分支}（如：写入本地待处理队列 + 返回用户友好提示 code=DEPENDENCY_DEGRADED），禁止让调用方感知 NPE/timeout 栈"
          verification: "Mock 外部系统返回 timeout / 5xx / 空响应三种场景；断言接口返回 200+code=DEPENDENCY_DEGRADED、本地队列有 1 条待处理记录、响应时间 < 超时阈值"
      - scenario: "外部系统返回异常字段（null / 非法枚举 / 超量）"
        bad_se: "校验外部系统返回值"
        good_se:
          description: "外部返回的 {关键字段} 为 null 或不在 {允许枚举集} 时，拒绝写入主流程，记录原始响应到审计表并告警，不允许用默认值静默替代"
          verification: "Mock 外部返回 {null, INVALID_ENUM, 负数/超大数} 三类异常数据；断言主表无新增记录、audit_log 表有原始响应、告警计数 +3"

  # ===== java-ddd-tmf 特定维度 =====

  - id: tmf_extension
    name: TMF 扩展点
    optional: true
    activation: "代码中存在 TMF Extension 注解，或 Q02/Q03 确认使用 TMF"
    questions:
      - "不同业务身份（直营/授权/线上）的差异逻辑是否走 Extension？"
      - "Extension 未匹配时的 fallback 策略？"
      - "TMF Step 编排是否覆盖了所有业务分支？"

  - id: approval_flow
    name: 审批流完整性
    optional: false
    applies_when: "PRD 涉及审批/审核流程"
    questions:
      - "审批链断裂（审批人离职/转岗）时的兜底策略？"
      - "审批超时未处理时的催办/自动流转机制？"
      - "审批金额/条件变更后，已发起的审批单是否需要重新走流程？"

  - id: batch_export
    name: 批量操作与导出
    optional: false
    applies_when: "PRD 涉及列表导出、批量审批、批量操作"
    questions:
      - "大数据量导出的性能和内存控制？（分页/流式）"
      - "导出期间数据变更是否影响导出结果？（快照隔离）"
      - "批量操作的原子性？部分失败时的处理？"
