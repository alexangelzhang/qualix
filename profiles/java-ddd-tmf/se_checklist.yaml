# SE 推导 Checklist — 通用维度 + java-ddd-tmf 特定维度
# Q01 Step 3b 加载此文件，逐维度扫描 REQ/BR 生成 SE

dimensions:
  # ===== 通用维度（所有技术栈） =====

  - id: state_machine
    name: 状态机完整性
    optional: false
    applies_when: "PRD 包含状态流转、审批流、工单生命周期"
    questions:
      - "每条迁移边是否有触发条件和数据流定义？"
      - "是否存在非法跳转路径？如何拦截？"
      - "终态是否不可回退？"
      - "循环边（驳回→重新发起）的数据流是否定义？"
      - "并行状态（如审批中+发放中）是否互斥？"

  - id: concurrency
    name: 并发/幂等
    optional: false
    applies_when: "always"
    questions:
      - "同一资源被多人同时操作时的行为？（乐观锁/悲观锁/队列）"
      - "重复提交同一请求的结果？（幂等键是什么？）"
      - "批量操作中部分失败时的回滚策略？"

  - id: permission
    name: 权限边界
    optional: false
    applies_when: "PRD 涉及多角色或数据隔离"
    questions:
      - "每个角色能看到哪些数据？能执行哪些操作？"
      - "跨角色/跨组织的数据隔离在哪一层实现？（查询层/API层/数据库层）"
      - "权限校验是否在 API 入口统一拦截，而非散落在业务代码中？"

  - id: data_consistency
    name: 数据一致性
    optional: false
    applies_when: "PRD 涉及多表更新、多系统交互、异步操作"
    questions:
      - "跨表/跨服务的数据更新是否在同一事务内？"
      - "异步操作（消息队列/回调）失败时数据是否会不一致？"
      - "缓存与数据库的一致性策略？"

  - id: precision
    name: 精度/溢出
    optional: false
    applies_when: "PRD 涉及金额、数量、百分比计算"
    questions:
      - "金额计算是否使用高精度类型？（Java: BigDecimal, Go: decimal）"
      - "累加多个金额时的精度保证？（每步 setScale 还是最终 setScale）"
      - "数量/金额是否有上下限校验？溢出时的行为？"

  - id: error_recovery
    name: 异常恢复
    optional: false
    applies_when: "always"
    questions:
      - "中间步骤失败时的回滚/补偿策略？"
      - "失败后能否重试？重试是否幂等？"
      - "异常状态的数据是否会被后续流程误读？"

  - id: time_window
    name: 时间窗口
    optional: false
    applies_when: "PRD 涉及有效期、超时、定时任务"
    questions:
      - "时效限制的计算起点和终点是否明确？（创建时间/结案时间/当前时间）"
      - "过期后的处理策略？（禁止操作/自动关闭/提示）"
      - "时区问题：服务器时区与用户时区不一致时的处理？"

  - id: external_dependency
    name: 外部依赖
    optional: false
    applies_when: "PRD 涉及调用外部系统/中台/第三方"
    questions:
      - "外部系统超时/不可用时的降级策略？"
      - "外部系统返回异常数据时的校验和兜底？"
      - "调用频率限制（rate limit）和重试策略？"

  # ===== java-ddd-tmf 特定维度 =====

  - id: ddd_aggregate
    name: DDD 聚合边界
    optional: false
    applies_when: "always"
    questions:
      - "核心业务对象的聚合根是什么？聚合边界在哪？"
      - "跨聚合的操作是否通过领域事件解耦？"
      - "聚合内的不变量（invariant）是否在领域层校验？"

  - id: tmf_extension
    name: TMF 扩展点
    optional: true
    activation: "代码中存在 TMF Extension 注解，或 Q02/Q03 确认使用 TMF"
    questions:
      - "不同业务身份（直营/授权/线上）的差异逻辑是否走 Extension？"
      - "Extension 未匹配时的 fallback 策略？"
      - "TMF Step 编排是否覆盖了所有业务分支？"

  - id: approval_flow
    name: 审批流完整性
    optional: false
    applies_when: "PRD 涉及审批/审核流程"
    questions:
      - "审批链断裂（审批人离职/转岗）时的兜底策略？"
      - "审批超时未处理时的催办/自动流转机制？"
      - "审批金额/条件变更后，已发起的审批单是否需要重新走流程？"

  - id: batch_export
    name: 批量操作与导出
    optional: false
    applies_when: "PRD 涉及列表导出、批量审批、批量操作"
    questions:
      - "大数据量导出的性能和内存控制？（分页/流式）"
      - "导出期间数据变更是否影响导出结果？（快照隔离）"
      - "批量操作的原子性？部分失败时的处理？"
