name: Qualix Quality Gate
description: 'Run Qualix quality gates from existing phase verdicts'

inputs:
  project-id:
    description: 'Qualix project ID, matching the directory name under output/'
    required: true
  phase:
    description: 'Phase ID to check, such as Q06, or all for every phase'
    default: 'Q06'
  fail-on:
    description: 'Failure level: hard, soft, or any'
    default: 'hard'
  output-dir:
    description: 'Path to the Qualix output directory'
    default: 'output'
  post-summary:
    description: 'Whether to write results to the GitHub Step Summary'
    default: 'true'

outputs:
  verdict:
    description: 'PASS / HARD_BLOCK / SOFT_WARN'
    value: ${{ steps.gate.outputs.verdict }}
  semantic-coverage:
    description: 'Semantic coverage at EUT granularity, 0.0-1.0'
    value: ${{ steps.gate.outputs.semantic_coverage }}

runs:
  using: composite
  steps:
    - name: Install Qualix
      shell: bash
      run: pip install -e "${{ github.action_path }}" --quiet

    - name: Run Qualix Quality Gate
      id: gate
      shell: bash
      run: |
        set +e

        PHASE_ARG="${{ inputs.phase }}"
        if [ "$PHASE_ARG" = "all" ]; then
          PHASE_FLAG="--all-phases"
        else
          PHASE_FLAG="$PHASE_ARG"
        fi

        JSON_OUT=$(qualix-run "${{ inputs.project-id }}" ci-gate $PHASE_FLAG \
          --fail-on "${{ inputs.fail-on }}" \
          --json \
          --base-dir "${{ inputs.output-dir }}/.." 2>/dev/null)
        EXIT_CODE=$?

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if echo "$JSON_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('hard' if d.get('data',{}).get('verdicts',{}) and any(v.get('hard_blocked') for v in d.get('data',{}).get('verdicts',{}).values()) else 'soft' if not d.get('success') else 'pass')" 2>/dev/null | grep -q "hard"; then
          echo "verdict=HARD_BLOCK" >> "$GITHUB_OUTPUT"
        elif [ "$EXIT_CODE" != "0" ]; then
          echo "verdict=SOFT_WARN" >> "$GITHUB_OUTPUT"
        else
          echo "verdict=PASS" >> "$GITHUB_OUTPUT"
        fi

        SEM_COV=$(echo "$JSON_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); sc=d.get('data',{}).get('semantic_coverage',{}); print(sc.get('semantic_coverage_rate',''))" 2>/dev/null || echo "")
        echo "semantic_coverage=$SEM_COV" >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.post-summary }}" = "true" ]; then
          qualix-run "${{ inputs.project-id }}" ci-gate $PHASE_FLAG \
            --fail-on "${{ inputs.fail-on }}" \
            --pr-comment \
            --base-dir "${{ inputs.output-dir }}/.." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
        fi

        exit $EXIT_CODE
