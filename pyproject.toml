[project]
name = "dev-quality-gate"
version = "0.1.0"
description = "研发质量门禁 — 从需求到代码的全链路防漏管线"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
feishu = ["larkkit"]
vlm = ["dashscope"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
dqg = "dqg.core.cli:main"
dqg-run = "dqg.core.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqg"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line too long — 交给 formatter
    "SIM108",  # ternary operator — 可读性优先
    "RUF001",  # ambiguous unicode char in string — 中文项目，全角字符正常
    "RUF002",  # ambiguous unicode char in docstring
    "RUF003",  # ambiguous unicode char in comment
]

[tool.ruff.lint.isort]
known-first-party = ["dqg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
