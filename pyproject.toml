[project]
name = "qualix"
dynamic = ["version"]
description = "AI-native development quality gate — full-chain coverage from requirements to code"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Alex Zhang" },
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
feishu = ["larkkit"]
vlm = ["dashscope"]
deepeval = ["deepeval>=3.0"]
tree-sitter = [
    "tree-sitter>=0.25",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
qualix = "qualix.core.cli:main"
qualix-run = "qualix.core.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/alexangelzhang/qualix"
Issues = "https://github.com/alexangelzhang/qualix/issues"
Source = "https://github.com/alexangelzhang/qualix"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/qualix"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "qualix/skills"
"references" = "qualix/references"
"profiles" = "qualix/profiles"
"agent_commands" = "qualix/claude_commands"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","SIM","TCH","RUF"]
ignore = ["E501","E402","N802","N806","SIM108","TC001","TC003","RUF001","RUF002","RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"**/tests/**" = ["RUF012"]
"**/test_*.py" = ["RUF012"]
"**/ingest/feishu/crawler.py" = ["F401"]
"**/memory/knowledge_network.py" = ["F401"]
"**/quality/judge/critique.py" = ["F401"]
"**/runtime/phase_contract.py" = ["F401"]
"**/qualix/skill_tracker.py" = ["F401"]
"**/qualix/text_utils.py" = ["F401"]
"**/context/analysis/weak_assert_context.py" = ["F401"]
"**/agents/adaptive_loop.py" = ["F401"]
"**/quality/eval/eval_baseline.py" = ["F401"]
"**/schemas/phase_a.py" = ["F403"]
"**/schemas/phase_a3.py" = ["F403"]
"**/schemas/phase_a5.py" = ["F403"]
"**/schemas/phase_a6.py" = ["F403"]
"**/schemas/phase_b.py" = ["F403"]
"**/schemas/phase_c.py" = ["F403"]
"**/schemas/phase_d.py" = ["F403"]
"**/agents/dag_scheduler.py" = ["F401"]
"**/commands/phase.py" = ["F401"]
"**/commands/phase_auto.py" = ["F401"]
"**/qualix/core/cli.py" = ["F401"]
"**/test_runtime.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["qualix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
